<script>
  import { onMount } from "olum";
  import sdk from "@stackblitz/sdk";
  import ThemeToggle from "./ThemeToggle";
  import Loader from "./Loader";
  import { sandbox, attachVm } from "../utils/sandbox";
  import { siteConfig } from "../utils/site-config";

  // The GitHub repo StackBlitz clones and runs live, as owner/repo/tree/branch
  // (github.com/olumjs/olum-starter/tree/code). Not a StackBlitz-hosted project;
  // the embed clones this repo into WebContainers.
  const STARTER_REPO_SLUG = "olumjs/olum-starter/tree/code";

  /** Tab the editor opens on — the starter's entry component. */
  const ENTRY_FILE = "src/page.html";

  // This template reads no state/store on purpose: the SDK puts an iframe inside
  // `.embed-host` that the template doesn't know about, and a re-render would
  // patch it away. Reactive bits live in ThemeToggle and Loader instead.
  // WebContainers needs the page to be cross-origin isolated. That is handled
  // before the app boots: host headers (vercel.json / public/_headers) or, where
  // a host can't send them, the service worker registered in public/index.html.
  onMount(() => {
    const embedHost = host.querySelector(".embed-host");
    if (!embedHost) return;

    let cancelled = false;
    // The SDK replaces the element it's given with the iframe, so embed into a
    // throwaway child of the stable host.
    const target = document.createElement("div");
    embedHost.replaceChildren(target);

    sdk
      .embedGithubProject(target, STARTER_REPO_SLUG, {
        forceEmbedLayout: true,
        openFile: ENTRY_FILE,
        view: "default",
        theme: sandbox.theme,
        hideNavigation: false,
        // The file explorer is how you reach the rest of the starter, so keep it.
        hideExplorer: false,
        hideDevTools: true,
        terminalHeight: 0, // minimize the terminal
        height: "100%",
        crossOriginIsolated: true,
      })
      .then((vm) => {
        if (cancelled) return;
        attachVm(vm);
        sandbox.ready = true;
      })
      .catch(() => {
        if (!cancelled) sandbox.ready = true;
      });

    return () => {
      cancelled = true;
      attachVm(null);
      sandbox.ready = false;
      embedHost.replaceChildren();
    };
  });
</script>
