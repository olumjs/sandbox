    <!-- Runs synchronously before first paint: dark is the default, and we only
         switch to light when the user has explicitly chosen it. The OS preference
         is never consulted, so there is no theme flash on reload. -->

         host didn't send COOP/COEP, register the worker and reload once so this
         page is served through it. The sessionStorage guard prevents a reload loop. -->
